name: Build APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Ensure Dist Folder
        run: |
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp -r .tanstack/start/public/* dist/ 2>/dev/null || cp -r build/* dist/ 2>/dev/null || true
          fi

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor
        run: npx cap init "CifraStop" "com.cifrastop.app" --web-dir "dist" || true

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cifrastop-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
